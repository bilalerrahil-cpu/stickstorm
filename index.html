<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Stickstorm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stickstorm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one portrait playfield letterboxed into the safe area; menus float over it as a toy-like card. */
:root {
  --ink: #16213a;
  --lane: #22325a;
  --lane-line: #2e4274;
  --rock: #3a5288;
  --rock-edge: #5671b0;
  --ours: #ffcf33;
  --ours-light: #fff0a0;
  --ours-deep: #c9930a;
  --ours-hot: #ff9f1c;
  --theirs: #ff4f7b;
  --theirs-light: #ff9bb8;
  --theirs-deep: #d8305f;
  --good: #2fd6a0;
  --bad: #ff7a45;
  --paper: #f3f6ff;
  --muted: #9fb0d6;
  --outline: #0d1428;
  --shadow: rgba(4, 8, 20, 0.32);
  --steel: #a9b8d8;
  --wood: #c98b4b;
  --bomb: #2a3350;
  --rail: #3b5591;
  --sky-top: #0b1226;
  --sky-low: #2a3d6b;
  --field-1: #1b3a36;
  --field-2: #2a2840;
  --field-3: #143349;
  --field-4: #2b1d3d;
  --scrim: rgba(16, 24, 44, 0.8);
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px);
  right: env(safe-area-inset-right, 0px);
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
#pauseBtn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 6px);
  right: calc(env(safe-area-inset-right, 0px) + 6px);
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 2px solid var(--lane-line);
  background: var(--lane);
  color: var(--paper);
  font: 15px/1 var(--font-display);
  letter-spacing: 2px;
  cursor: pointer;
}
#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  background: var(--scrim);
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.panel {
  margin: auto;
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  text-align: center;
}
h1 {
  margin: 0;
  font: 60px/0.95 var(--font-display);
  color: var(--ours);
  text-shadow: 4px 4px 0 var(--theirs);
  letter-spacing: 1px;
  text-wrap: balance;
}
h2 {
  margin: 0;
  font: 40px/1 var(--font-display);
  color: var(--ours);
  text-wrap: balance;
}
.tag, .how, .res-text { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
.how { font-size: 13px; }
.eyebrow {
  margin: 0;
  font: 800 12px/1 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--good);
}
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; text-align: left; }
.world {
  grid-column: 1 / -1;
  margin-top: 6px;
  font: 800 11px/1 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted);
}
.lvl {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 2px 6px;
  border-radius: 12px;
  border: 2px solid var(--lane-line);
  background: var(--lane);
  color: var(--paper);
  cursor: pointer;
  font-family: var(--font-body);
}
.lvl b { font: 24px/1 var(--font-display); color: var(--ours); }
.lvl span { font-size: 9px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lvl.boss span { color: var(--theirs); }
.lvl:disabled { opacity: 0.35; cursor: default; }
.lvl.done b { color: var(--good); }
.cannons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; }
.cannon {
  display: flex; flex-direction: column; gap: 3px;
  min-width: 0;
  padding: 10px 12px;
  border-radius: 12px;
  border: 2px solid var(--lane-line);
  background: var(--lane);
  color: var(--paper);
  cursor: pointer;
  font-family: var(--font-body);
  text-align: left;
}
.cannon b { font: 20px/1 var(--font-display); color: var(--ours); }
.cannon span { font-size: 12px; line-height: 1.3; color: var(--muted); }
.cannon i { font-style: normal; font-size: 11px; font-weight: 800; color: var(--paper); font-variant-numeric: tabular-nums; }
.cannon.on { border-color: var(--ours); box-shadow: inset 0 0 0 1px var(--ours); }
.cannon:disabled { opacity: 0.35; cursor: default; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  flex: 1 1 140px;
  padding: 14px 18px;
  border: 0;
  border-radius: 14px;
  background: var(--ours);
  color: var(--ink);
  font: 22px/1 var(--font-display);
  box-shadow: 0 5px 0 var(--ours-deep);
  cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ours-deep); }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px var(--lane-line); }
button:focus-visible { outline: 3px solid var(--good); outline-offset: 3px; }
</style>

<div id="stage"><canvas id="cv"></canvas></div>
<button id="pauseBtn" aria-label="Pause" hidden>II</button>

<div id="overlay">
  <div class="panel" id="menu">
    <h1>Stickstorm</h1>
    <p class="tag">Fire your crowd through the gates and knock down every tower before their army reaches you.</p>
    <div class="levels" id="levels"></div>
    <p class="how">Drag to slide the cannon. Hold to keep firing. Beat levels to unlock new cannons.</p>
  </div>
  <div class="panel" id="pick" hidden>
    <p class="eyebrow" id="pickEyebrow"></p>
    <h2>Choose a cannon</h2>
    <div class="cannons" id="cannons"></div>
    <div class="row">
      <button class="btn" id="pickStart">Start</button>
      <button class="btn ghost" id="pickBack">Levels</button>
    </div>
  </div>
  <div class="panel" id="result" hidden>
    <p class="eyebrow" id="resEyebrow"></p>
    <h2 id="resTitle"></h2>
    <p class="res-text" id="resText"></p>
    <div class="row">
      <button class="btn" id="resPrimary"></button>
      <button class="btn ghost" id="resCannon">Cannon</button>
    </div>
    <div class="row"><button class="btn ghost" id="resMenu">Levels</button></div>
  </div>
  <div class="panel" id="paused" hidden>
    <h2>Paused</h2>
    <div class="row">
      <button class="btn" id="pResume">Resume</button>
      <button class="btn ghost" id="pRestart">Restart</button>
    </div>
    <div class="row"><button class="btn ghost" id="pMenu">Levels</button></div>
  </div>
</div>

    obs: [{ k: 'bar', x: 200, y: 460, len: 150, spd: 1.7 }, { k: 'wall', x: 60, y: 330, w: 70, h: 14, amp: 30, spd: 1.2 },
          { k: 'wall', x: 270, y: 330, w: 70, h: 14, amp: 30, spd: 1.2 }],
    gates: [{ x: 30, y: 560, w: 100, op: 'x', n: 2 }, { x: 270, y: 560, w: 100, op: 'x', n: 3 },
            { x: 150, y: 390, w: 100, op: 'x', n: 2, amp: 120, spd: 1.1 }, { x: 150, y: 250, w: 100, op: '-', n: 25 }] },
  { name: 'Stormcrown', towers: [boss(1100, { every: 2.0, burst: 15, brute: 2, amp: 100, spd: 0.9, shield: true, mix: [T.STICK, T.RUNNER, T.ARCHER] })],
    obs: [{ k: 'bar', x: 110, y: 470, len: 110, spd: 2.2 }, { k: 'bar', x: 290, y: 470, len: 110, spd: -2.2 },
          { k: 'wall', x: 150, y: 340, w: 100, h: 14, amp: 110, spd: 0.8 }, { k: 'bump', x: 200, y: 560, r: 18 }],
    gates: [{ x: 30, y: 590, w: 110, op: 'x', n: 2 }, { x: 260, y: 590, w: 110, op: 'x', n: 2 },
            { x: 150, y: 410, w: 100, op: 'x', n: 3, amp: 120, spd: 1.2 }, { x: 40, y: 260, w: 100, op: '+', n: 12 }, { x: 260, y: 260, w: 100, op: '-', n: 30 }] },
];

// ---- Unit pool (structure of arrays, no per-frame allocation) ----
const ux = new Float32Array(MAX), uy = new Float32Array(MAX);
const uvx = new Float32Array(MAX), uvy = new Float32Array(MAX);
const uhp = new Float32Array(MAX), ur = new Float32Array(MAX), uspd = new Float32Array(MAX);
const uph = new Float32Array(MAX), ucd = new Float32Array(MAX), uair = new Float32Array(MAX);
const uteam = new Uint8Array(MAX), utype = new Uint8Array(MAX), alive = new Uint8Array(MAX);
const umask = new Uint32Array(MAX);
const utgt = new Int32Array(MAX);
const act = new Int32Array(MAX), pos = new Int32Array(MAX), free = new Int32Array(MAX);
let nAct = 0, nFree = 0;
const count = [0, 0];

// Per-team spatial grids sharing one "next" chain.
const head = [new Int32Array(COLS * ROWS), new Int32Array(COLS * ROWS)];
const next = new Int32Array(MAX);


// Particles (ring buffer).
const px = new Float32Array(MAXP), py = new Float32Array(MAXP);
const pvx = new Float32Array(MAXP), pvy = new Float32Array(MAXP);
const plife = new Float32Array(MAXP), pteam = new Uint8Array(MAXP);
const pz = new Float32Array(MAXP), pvz = new Float32Array(MAXP);
let pNext = 0;

// Arrows (ring buffer).
const qx = new Float32Array(MAXQ), qy = new Float32Array(MAXQ);
const qvx = new Float32Array(MAXQ), qvy = new Float32Array(MAXQ);
const qlife = new Float32Array(MAXQ), qteam = new Uint8Array(MAXQ);
let qNext = 0;

// Explosion rings (ring buffer).
const rx = new Float32Array(MAXR), ry = new Float32Array(MAXR), rlife = new Float32Array(MAXR), rsz = new Float32Array(MAXR);
let rNext = 0;

function resetPools() {
  nAct = 0; nFree = MAX; count[0] = count[1] = 0;
  for (let i = 0; i < MAX; i++) { free[i] = MAX - 1 - i; alive[i] = 0; }
  plife.fill(0); qlife.fill(0); rlife.fill(0);
}

function spawn(team, type, x, y, mask) {
  if (nFree === 0) return -1;
  const i = free[--nFree], u = UNIT[type];
  ux[i] = x; uy[i] = y; uvx[i] = 0; uvy[i] = 0;
  uteam[i] = team; utype[i] = type; umask[i] = mask;
  uhp[i] = u.hp; ur[i] = u.r;
  uspd[i] = u.spd * (team ? ENEMY_PACE : 1) * (0.92 + Math.random() * 0.16);
  uph[i] = Math.random() * TAU;
  ucd[i] = 0; uair[i] = 0;
  utgt[i] = -1;
  alive[i] = 1;
  pos[i] = nAct; act[nAct++] = i;
  count[team]++;
  return i;
}

function puff(x, y, team, n, speed) {
  for (let k = 0; k < n; k++) {
    const j = pNext; pNext = (pNext + 1) % MAXP;
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    px[j] = x; py[j] = y; pvx[j] = Math.cos(a) * s; pvy[j] = Math.sin(a) * s;
    plife[j] = 0.45 + Math.random() * 0.35; pteam[j] = team;
    pz[j] = 4; pvz[j] = 50 + Math.random() * 110;
  }
}

function kill(i) {
  if (!alive[i]) return;
  alive[i] = 0;
  const p = pos[i], last = act[--nAct];
  act[p] = last; pos[last] = p;
  free[nFree++] = i;
  count[uteam[i]]--;
  puff(ux[i], uy[i], uteam[i], utype[i] >= T.HEAVY ? 16 : 5, 70);
}

function cellOf(x, y) {
  let cx = (x / CELL) | 0, cy = ((y + CELL) / CELL) | 0;
  if (cx < 0) cx = 0; else if (cx >= COLS) cx = COLS - 1;
  if (cy < 0) cy = 0; else if (cy >= ROWS) cy = ROWS - 1;
  return cy * COLS + cx;
}

function buildGrid() {
  head[0].fill(-1); head[1].fill(-1);
  for (let k = 0; k < nAct; k++) {
    const i = act[k];
    if (uair[i] > 0) continue;            // airborne units can't be hit or targeted
    const c = cellOf(ux[i], uy[i]), h = head[uteam[i]];
    next[i] = h[c]; h[c] = i;
  }
}

// Nearest grounded unit of the other team within `rad` of (x, y), or -1.
function nearestFoe(team, x, y, rad) {
  const h = head[team ^ 1];
  const c = cellOf(x, y), cx = c % COLS, cy = (c / COLS) | 0;
  const cr = Math.ceil(rad / CELL);
  const x0 = Math.max(0, cx - cr), x1 = Math.min(COLS - 1, cx + cr);
  const y0 = Math.max(0, cy - cr), y1 = Math.min(ROWS - 1, cy + cr);
  let best = -1, bd = rad * rad;
  for (let gy = y0; gy <= y1; gy++) {
    for (let gx = x0; gx <= x1; gx++) {
      let j = h[gy * COLS + gx];
      while (j !== -1) {
        if (alive[j]) {
          const dx = ux[j] - x, dy = uy[j] - y, d2 = dx * dx + dy * dy;
          if (d2 < bd) { bd = d2; best = j; }
        }
        j = next[j];
      }
    }
  }
  return best;
}

// ---- Game state ----
let levelIdx = 0, L = LEVELS[0];
let cannonIdx = 0, CN = CANNONS[0];
let state = 'menu';        // menu | play | paused | won | lost
let attract = true;        // demo mode behind the menu
let t = 0, frame = 0, endT = 0;
let cannonX = 200, targetX = 200, firing = false, fireT = 0, charge = 0, shots = 0;
let shake = 0, recoil = 0, hurt = 0;
const base = { hp: 0, max: 15 };
let towers = [], gates = [], obstacles = [];
let towersLeft = 0;
let keyL = false, keyR = false, keySpace = false;
let newCannon = -1;

let unlocked = 0;
try { unlocked = Math.min(LEVELS.length - 1, parseInt(localStorage.getItem('stickstorm.unlocked') || '0', 10) || 0); } catch (e) {}
try { cannonIdx = Math.min(CANNONS.length - 1, parseInt(localStorage.getItem('stickstorm.cannon') || '0', 10) || 0); } catch (e) {}
if (CANNONS[cannonIdx].unlock > unlocked) cannonIdx = 0;
function save() {
  try {
    localStorage.setItem('stickstorm.unlocked', String(unlocked));
    localStorage.setItem('stickstorm.cannon', String(cannonIdx));
  } catch (e) {}
}

function loadLevel(idx, demo, cIdx) {
  levelIdx = idx; L = LEVELS[idx]; attract = demo;
  CN = CANNONS[demo ? 0 : cIdx];
  resetPools();
  t = 0; frame = 0; endT = 0;
  cannonX = targetX = 200; firing = false; fireT = 0; charge = 0; shots = 0; shake = 0; recoil = 0; hurt = 0;
  base.hp = base.max;
  towers = L.towers.map(d => ({
    x: d.x, baseX: d.x, y: d.y, w: d.w, h: d.h, hp: d.hp, max: d.hp, hit: 0,
    every: d.every, burst: d.burst, mix: d.mix, brute: d.brute, boss: !!d.boss,
    amp: d.amp || 0, spd: d.spd || 0, shieldOn: !!d.shield, shield: 0, stage: 0,
    spawnT: 1.5, bursts: 0, flash: 0, dmg: 0, dmgT: 0, fall: 0,
  }));
  towersLeft = towers.length;
  gates = L.gates.map((g, k) => ({
    x: g.x, baseX: g.x, y: g.y, w: g.w, op: g.op, n: g.n,
    amp: g.amp || 0, spd: g.spd || 0, phase: k * 1.7,
    left: g.n, broken: 0, cd: 0, flash: 0, bit: 1 << k, pop: 0, popT: 0,
    label: g.op === 'x' ? '×' + g.n : g.op === '+' ? '+' + g.n : '−' + g.n,
  }));
  obstacles = (L.obs || []).map((o, k) => ({
    k: o.k === 'wall' ? 0 : o.k === 'bar' ? 1 : 2,
    x: o.x, baseX: o.x, y: o.y, w: o.w || 0, h: o.h || 0, r: o.r || 0,
    len: o.len || 0, spd: o.spd || 0, amp: o.amp || 0, a: k * 0.9, flash: 0,
  }));
  buildProps();
}

function shoot(type) {
  const i = spawn(0, type, cannonX + (Math.random() - 0.5) * 6, CANNON_Y - 24, 0);
  if (i >= 0 && CN.pattern === 'lob' && type !== T.HEAVY) uair[i] = 0.9;
  return i;
}

function fire() {
  shots++; charge++; recoil = 1;
  if (charge >= CN.charge) {
    charge = 0;
    const i = shoot(T.HEAVY);
    if (i >= 0) uvx[i] = 0;
    return;
  }
  if (CN.pattern === 'spread') {
    for (let d = -1; d <= 1; d++) { const i = shoot(CN.type); if (i >= 0) uvx[i] = d * 75; }
  } else {
    const i = shoot(CN.type);
    if (i >= 0) uvx[i] = (Math.random() - 0.5) * 24;
  }
}

function passGate(i, g) {
  umask[i] |= g.bit;
  g.flash = 0.12;
  if (g.op === '-') {
    g.left--;
    g.pop--; g.popT = 0.9;
    if (g.left <= 0) { g.broken = 4; g.left = 0; }
    kill(i);
    return;
  }
  let n = 0;
  if (g.op === 'x') n = g.n - 1;
  else if (g.cd <= 0) { n = g.n; g.cd = 0.3; }
  // Tanks and heavies don't copy themselves; gates turn them into stickmen.
  const type = utype[i] === T.TANK || utype[i] === T.HEAVY ? T.STICK : utype[i];
  const m = umask[i], x = ux[i], y = uy[i] - 2;
  let made = 0;
  for (let k = 0; k < n; k++) {
    const j = spawn(0, type, x + (Math.random() - 0.5) * 14, y - Math.random() * 6, m);
    if (j < 0) break;
    uvx[j] = (Math.random() - 0.5) * 70;
    made++;
  }
  if (made) { g.pop += made; g.popT = 0.9; }
}

function hitTower(tw, d) {
  if (tw.hp <= 0) return;
  tw.hp = Math.max(0, tw.hp - d);
  tw.hit = 0.1; tw.flash = 0.09;
  tw.dmg += d; tw.dmgT = 0.8;
  if (tw.boss) {
    const f = tw.hp / tw.max;
    if ((tw.stage === 0 && f <= 0.66) || (tw.stage === 1 && f <= 0.33)) {
      tw.stage++;
      spawn(1, T.GIANT, tw.x, tw.y + tw.h / 2 + 20, 0);
      tw.every *= 0.8;
      if (tw.shieldOn) tw.shield = 3;
    }
  }
  if (tw.hp === 0) {
    towersLeft--;
    tw.fall = 0.6; shake = 0.3;
    for (let r = 0; r < 2; r++) {
      const j = rNext; rNext = (rNext + 1) % MAXR;
      rx[j] = tw.x; ry[j] = tw.y + tw.h / 2; rlife[j] = 0.3 + r * 0.15; rsz[j] = 2.5 + r * 1.5;
    }
    for (let k = 0; k < 40; k++) {
      const j = pNext; pNext = (pNext + 1) % MAXP;
      const a = Math.random() * TAU, s = 60 + Math.random() * 160;
      px[j] = tw.x + (Math.random() - 0.5) * tw.w; py[j] = tw.y + (Math.random() - 0.5) * tw.h;
      pvx[j] = Math.cos(a) * s; pvy[j] = Math.sin(a) * s; plife[j] = 1.1; pteam[j] = 1;
      pz[j] = 20 + Math.random() * 60; pvz[j] = 80 + Math.random() * 160;
    }
    if (towersLeft === 0) endRound('won');
  }
}

function hitBase(d) {
  if (base.hp <= 0) return;
  base.hp = Math.max(0, base.hp - d);
  shake = 0.18; hurt = 0.4;
  if (base.hp === 0) endRound('lost');
}

function explode(i) {
  const x = ux[i], y = uy[i], team = uteam[i];
  const j = rNext; rNext = (rNext + 1) % MAXR;
  rx[j] = x; ry[j] = y; rlife[j] = 0.3; rsz[j] = 1;
  const h = head[team ^ 1];
  const c = cellOf(x, y), cx = c % COLS, cy = (c / COLS) | 0;
  for (let gy = Math.max(0, cy - 2); gy <= Math.min(ROWS - 1, cy + 2); gy++) {
    for (let gx = Math.max(0, cx - 2); gx <= Math.min(COLS - 1, cx + 2); gx++) {
      let k = h[gy * COLS + gx];
      while (k !== -1) {
        const nk = next[k];
        if (alive[k]) {
          const dx = ux[k] - x, dy = uy[k] - y, rr = BOMB_RADIUS + ur[k];
          if (dx * dx + dy * dy < rr * rr) { uhp[k] -= BOMB_DAMAGE; if (uhp[k] <= 0) kill(k); }
        }
        k = nk;
      }
    }
  }
  puff(x, y, team, 12, 160);
  kill(i);
}

function endRound(result) {
  if (attract) { endT = 1.2; state = result; return; }
  if (state !== 'play') return;
  state = result; endT = 1.0; firing = false;
  newCannon = -1;
  if (result === 'won' && levelIdx + 1 > unlocked) {
    const before = unlocked;
    unlocked = Math.min(LEVELS.length - 1, levelIdx + 1);
    // Beating the last level counts as one more for unlocks.
    const beaten = levelIdx + 1;
    for (let c = 0; c < CANNONS.length; c++) if (CANNONS[c].unlock > before && CANNONS[c].unlock <= beaten) newCannon = c;
    save();
  }
}

function standingTowerNear(x) {
  let best = null, bd = 1e9;
  for (let k = 0; k < towers.length; k++) {
    const tw = towers[k];
    if (tw.hp <= 0) continue;
    const d = Math.abs(tw.x - x);
    if (d < bd) { bd = d; best = tw; }
  }
  return best;
}

// Push unit i out of obstacles; units blocked head-on slide toward the open end of a wall.
function collide(i, dt) {
  const r = ur[i];
  for (let k = 0; k < obstacles.length; k++) {
    const o = obstacles[k];
    const x = ux[i], y = uy[i];
    if (o.k === 0) {
      const x0 = o.x, x1 = o.x + o.w, y0 = o.y, y1 = o.y + o.h;
      if (x + r < x0 || x - r > x1 || y + r < y0 || y - r > y1) continue;
      const cx = x < x0 ? x0 : x > x1 ? x1 : x, cy = y < y0 ? y0 : y > y1 ? y1 : y;
      const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
      if (d2 >= r * r) continue;
      let vertical;
      if (d2 > 0) {
        const d = Math.sqrt(d2);
        ux[i] = cx + dx / d * r; uy[i] = cy + dy / d * r;
        vertical = Math.abs(dy) > Math.abs(dx);
      } else {
        const l = x - x0, rt = x1 - x, tp = y - y0, bt = y1 - y, m = Math.min(l, rt, tp, bt);
        vertical = m === tp || m === bt;
        if (m === tp) uy[i] = y0 - r; else if (m === bt) uy[i] = y1 + r;
        else if (m === l) ux[i] = x0 - r; else ux[i] = x1 + r;
      }
      if (vertical) {
        let dir = x < (x0 + x1) / 2 ? -1 : 1;
        if (x0 <= TL + 1) dir = 1; else if (x1 >= TR - 1) dir = -1;
        ux[i] += dir * uspd[i] * dt;
        uvx[i] = dir * uspd[i] * 0.6;
      }
    } else if (o.k === 1) {
      const hx = Math.cos(o.a) * o.len / 2, hy = Math.sin(o.a) * o.len / 2;
      const ax = o.x - hx, ay = o.y - hy;
      const ex = hx * 2, ey = hy * 2;
      let s = ((x - ax) * ex + (y - ay) * ey) / (ex * ex + ey * ey);
      s = s < 0 ? 0 : s > 1 ? 1 : s;
      const cx = ax + ex * s, cy = ay + ey * s;
      const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy, R = r + 4;
      if (d2 >= R * R) continue;
      const d = Math.sqrt(d2) || 0.01;
      ux[i] = cx + dx / d * (R + 1); uy[i] = cy + dy / d * (R + 1);
      uvx[i] += dx / d * 60;
    } else {
      const dx = x - o.x, dy = y - o.y, d2 = dx * dx + dy * dy, R = o.r + r;
      if (d2 >= R * R) continue;
      const d = Math.sqrt(d2) || 0.01;
      ux[i] = o.x + dx / d * R; uy[i] = o.y + dy / d * R;
      uvx[i] = (dx < 0 ? -1 : 1) * uspd[i] * 0.9;
      o.flash = 0.15;
    }
  }
  if (ux[i] < TL + 4) ux[i] = TL + 4; else if (ux[i] > TR - 4) ux[i] = TR - 4;
}

// ---- Simulation ----
function update(dt) {
  t += dt; frame++;
  const playing = state === 'play' || (attract && state === 'menu');

  if (attract && state === 'menu') {
    targetX = 200 + Math.sin(t * 0.8) * 120 + Math.sin(t * 2.3) * 30;
    firing = true;
  } else if (state === 'play') {
    if (keyL) targetX -= 260 * dt;
    if (keyR) targetX += 260 * dt;
    if (keySpace) firing = true;
  }
  targetX = Math.max(TL + 18, Math.min(TR - 18, targetX));
  cannonX += (targetX - cannonX) * Math.min(1, dt * 20);

  if (playing && firing) {
    fireT -= dt;
    if (fireT <= 0) { fire(); fireT += 1 / CN.rate; if (fireT < 0) fireT = 0; }
  } else if (fireT > 0) fireT = Math.max(0, fireT - dt);

  // Towers: drift, shields, enemy waves.
  for (let k = 0; k < towers.length; k++) {
    const tw = towers[k];
    if (tw.flash > 0) tw.flash -= dt;
    if (tw.dmgT > 0) { tw.dmgT -= dt; if (tw.dmgT <= 0) tw.dmg = 0; }
    if (tw.fall > 0) tw.fall -= dt;
    if (tw.hp <= 0) continue;
    if (tw.amp) tw.x = Math.max(TL + tw.w / 2, Math.min(TR - tw.w / 2, tw.baseX + Math.sin(t * tw.spd) * tw.amp));
    if (tw.shield > 0) tw.shield -= dt;
    if (tw.hit > 0) tw.hit -= dt;
    if (!playing) continue;
    tw.spawnT -= dt;
    if (tw.spawnT <= 0) {
      tw.spawnT += tw.every;
      tw.bursts++;
      // Waves grow as the round drags on.
      const n = Math.round(tw.burst * (1 + tw.bursts * 0.04));
      for (let j = 0; j < n; j++) {
        const type = tw.mix[(Math.random() * tw.mix.length) | 0];
        spawn(1, type, tw.x + (Math.random() - 0.5) * tw.w * 0.9, tw.y + tw.h / 2 + 6 + Math.random() * 24, 0);
      }
      if (tw.brute && tw.bursts % tw.brute === 0) spawn(1, T.HEAVY, tw.x, tw.y + tw.h / 2 + 12, 0);
    }
  }

  for (let k = 0; k < gates.length; k++) {
    const g = gates[k];
    if (g.amp) g.x = Math.max(TL, Math.min(TR - g.w, g.baseX + Math.sin(t * g.spd + g.phase) * g.amp));
    if (g.cd > 0) g.cd -= dt;
    if (g.flash > 0) g.flash -= dt;
    if (g.popT > 0) { g.popT -= dt; if (g.popT <= 0) g.pop = 0; }
    if (g.broken > 0) { g.broken -= dt; if (g.broken <= 0) { g.broken = 0; g.left = g.n; } }
  }
  for (let k = 0; k < obstacles.length; k++) {
    const o = obstacles[k];
    if (o.k === 1) o.a += o.spd * dt;
    if (o.amp) o.x = Math.max(TL, Math.min(TR - o.w, o.baseX + Math.sin(t * o.spd + k) * o.amp));
    if (o.flash > 0) o.flash -= dt;
  }

  buildGrid();

  // Movement, gates, obstacles, tower and base contact.
  for (let k = nAct - 1; k >= 0; k--) {
    if (k >= nAct) continue;
    const i = act[k];
    const team = uteam[i], type = utype[i], sp = uspd[i];
    uph[i] += dt * sp * 0.13;
    if (ucd[i] > 0) ucd[i] -= dt;

    if (uair[i] > 0) {                      // lobbed: fly straight up, skip everything
      uair[i] -= dt;
      uy[i] -= sp * 1.8 * dt;
      ux[i] += uvx[i] * dt;
      continue;
    }

    const archer = type === T.ARCHER;
    if (((frame + i) & 3) === 0) utgt[i] = nearestFoe(team, ux[i], uy[i], archer ? ARCHER_RANGE : team ? 85 : 60);
    let tg = utgt[i];
    if (tg >= 0 && (!alive[tg] || uteam[tg] === team || uair[tg] > 0)) { tg = -1; utgt[i] = -1; }
    if (tg >= 0) {
      const dx = ux[tg] - ux[i], dy = uy[tg] - uy[i], d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (archer) {
        uvx[i] = 0; uvy[i] = 0;
        if (ucd[i] <= 0) {
          ucd[i] = ARCHER_RELOAD;
          const q = qNext; qNext = (qNext + 1) % MAXQ;
          qx[q] = ux[i]; qy[q] = uy[i] - 4; qvx[q] = dx / d * ARROW_SPEED; qvy[q] = dy / d * ARROW_SPEED;
          qlife[q] = 0.55; qteam[q] = team;
        }
      } else { uvx[i] = dx / d * sp; uvy[i] = dy / d * sp; }
    } else if (team === 0) {
      uvy[i] = -sp;
      const tw = standingTowerNear(ux[i]);
      if (tw && uy[i] < tw.y + 220) {
        const v = (tw.x - ux[i]) * 1.6;
        uvx[i] = v > sp ? sp : v < -sp ? -sp : v;
      } else uvx[i] *= Math.max(0, 1 - 1.5 * dt);
    } else {
      uvy[i] = sp;
      const v = (cannonX - ux[i]) * 0.25, lim = sp * 0.5;
      uvx[i] = v > lim ? lim : v < -lim ? -lim : v;
    }
    const oy = uy[i];
    let nx = ux[i] + uvx[i] * dt;
    const ny = oy + uvy[i] * dt;
    if (nx < TL + 4) nx = TL + 4; else if (nx > TR - 4) nx = TR - 4;
    ux[i] = nx; uy[i] = ny;

    if (team === 0) {
      for (let gi = 0; gi < gates.length; gi++) {
        const g = gates[gi];
        if (oy >= g.y && ny < g.y && nx >= g.x && nx <= g.x + g.w && !(umask[i] & g.bit) && !(g.op === '-' && g.broken > 0)) {
          passGate(i, g);
          if (!alive[i]) break;
        }
      }
      if (!alive[i]) continue;
    }
    if (obstacles.length) collide(i, dt);

    if (team === 0) {
      const x = ux[i], y = uy[i];
      let done = false;
      for (let ti = 0; ti < towers.length && !done; ti++) {
        const tw = towers[ti];
        if (tw.hp <= 0 || y > tw.y + tw.h / 2 || y < tw.y - tw.h / 2 - 10 || x < tw.x - tw.w / 2 || x > tw.x + tw.w / 2) continue;
        done = true;
        if (tw.shield > 0) kill(i);
        else if (type === T.BOMBER) { hitTower(tw, BOMB_TOWER_DAMAGE); explode(i); }
        else { hitTower(tw, uhp[i]); kill(i); }
      }
      if (!done && y < -10) kill(i);
    } else if (uy[i] >= BASE_Y) {
      hitBase(UNIT[type].base); kill(i);
    }
  }

  // Combat: our grounded units against nearby enemies, using the enemy grid.
  const eh = head[1];
  for (let k = nAct - 1; k >= 0; k--) {
    if (k >= nAct) continue;
    const i = act[k];
    if (uteam[i] !== 0 || uair[i] > 0) continue;
    const c = cellOf(ux[i], uy[i]), cx = c % COLS, cy = (c / COLS) | 0;
    let dead = false;
    for (let gy = Math.max(0, cy - 1); gy <= Math.min(ROWS - 1, cy + 1) && !dead; gy++) {
      for (let gx = Math.max(0, cx - 1); gx <= Math.min(COLS - 1, cx + 1) && !dead; gx++) {
        let j = eh[gy * COLS + gx];
        while (j !== -1) {
          const nj = next[j];
          if (alive[j]) {
            const dx = ux[j] - ux[i], dy = uy[j] - uy[i], rr = ur[i] + ur[j];
            if (dx * dx + dy * dy < rr * rr) {
              if (utype[i] === T.BOMBER) { explode(i); dead = true; break; }
              const d = Math.min(uhp[i], uhp[j]);
              uhp[i] -= d; uhp[j] -= d;
              if (uhp[j] <= 0) kill(j);
              if (uhp[i] <= 0) { kill(i); dead = true; break; }
            }
          }
          j = nj;
        }
      }
    }
  }

  // Arrows.
  for (let q = 0; q < MAXQ; q++) {
    if (qlife[q] <= 0) continue;
    qlife[q] -= dt;
    const x = (qx[q] += qvx[q] * dt), y = (qy[q] += qvy[q] * dt);
    const team = qteam[q], h = head[team ^ 1];
    const c = cellOf(x, y), cx = c % COLS, cy = (c / COLS) | 0;
    let hit = false;
    for (let gy = Math.max(0, cy - 1); gy <= Math.min(ROWS - 1, cy + 1) && !hit; gy++) {
      for (let gx = Math.max(0, cx - 1); gx <= Math.min(COLS - 1, cx + 1) && !hit; gx++) {
        let j = h[gy * COLS + gx];
        while (j !== -1) {
          if (alive[j]) {
            const dx = ux[j] - x, dy = uy[j] - y, rr = ur[j] + 2;
            if (dx * dx + dy * dy < rr * rr) {
              uhp[j] -= 1;
              if (uhp[j] <= 0) kill(j);
              hit = true; break;
            }
          }
          j = next[j];
        }
      }
    }
    if (!hit && team === 0) {
      for (let ti = 0; ti < towers.length; ti++) {
        const tw = towers[ti];
        if (tw.hp > 0 && Math.abs(x - tw.x) < tw.w / 2 && Math.abs(y - tw.y) < tw.h / 2) {
          if (tw.shield <= 0) hitTower(tw, 1);
          hit = true; break;
        }
      }
    }
    if (hit) qlife[q] = 0;
  }

  for (let j = 0; j < MAXP; j++) {
    if (plife[j] <= 0) continue;
    plife[j] -= dt;
    px[j] += pvx[j] * dt; py[j] += pvy[j] * dt;
    pvx[j] *= 0.94; pvy[j] *= 0.94;
    pvz[j] -= 320 * dt; pz[j] += pvz[j] * dt;
    if (pz[j] < 0) { pz[j] = 0; pvz[j] *= -0.35; }
  }
  for (let j = 0; j < MAXR; j++) if (rlife[j] > 0) rlife[j] -= dt;

  if (shake > 0) shake -= dt;
  if (recoil > 0) recoil = Math.max(0, recoil - dt * 9);
  if (hurt > 0) hurt -= dt;

  if (state === 'won' || state === 'lost') {
    endT -= dt;
    if (endT <= 0) {
      if (attract) { loadLevel(levelIdx, true, 0); state = 'menu'; }
      else if (overlay.hidden) showResult();
    }
  }
}

// ---- Rendering ----
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
let dpr = 1, scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0;

function resize() {
  const r = cv.getBoundingClientRect();
  cssW = r.width; cssH = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / W, cssH / H);
  offX = (cssW - W * scale) / 2; offY = (cssH - H * scale) / 2;
}
window.addEventListener('resize', resize);

// Camera: the track tilts away from the player. proj(x, y, z) maps a ground point
// (x, y) raised by z into screen space (PX, PY) with scale PS; far is small and high.
const HORIZON_Y = 84, DEPTH = 0.75, CX = W / 2;
function sAt(y) { return 1 / (1 + (H - y) / H * DEPTH); }
const S_FAR = sAt(0), GY = (H - HORIZON_Y) / (1 - S_FAR), Y0 = H - GY;
const S_CANNON = sAt(CANNON_Y);
let PX = 0, PY = 0, PS = 1;
function proj(x, y, z) { const s = sAt(y); PS = s; PX = CX + (x - CX) * s; PY = Y0 + GY * s - z * s; }
function lineTo3(x, y, z) { proj(x, y, z); ctx.lineTo(PX, PY); }
function moveTo3(x, y, z) { proj(x, y, z); ctx.moveTo(PX, PY); }

function rrectOn(g, x, y, w, h, r) {
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function rrect(x, y, w, h, r) { rrectOn(ctx, x, y, w, h, r); }

function groundQuad(x0, y0, x1, y1, z) {
  moveTo3(x0, y0, z); lineTo3(x1, y0, z); lineTo3(x1, y1, z); lineTo3(x0, y1, z); ctx.closePath();
}

// A box standing on the ground: the side facing the centre line, the top, then the front.
function box(x0, y0, x1, y1, z, top, front, side) {
  if (x1 < CX || x0 > CX) {
    const sx = x1 < CX ? x1 : x0;
    ctx.fillStyle = side;
    ctx.beginPath(); moveTo3(sx, y1, 0); lineTo3(sx, y0, 0); lineTo3(sx, y0, z); lineTo3(sx, y1, z); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = top;
  ctx.beginPath(); groundQuad(x0, y0, x1, y1, z); ctx.fill();
  ctx.fillStyle = front;
  ctx.beginPath(); moveTo3(x0, y1, 0); lineTo3(x1, y1, 0); lineTo3(x1, y1, z); lineTo3(x0, y1, z); ctx.closePath(); ctx.fill();
}

// ---- Character sprites ----
// Each team+type is drawn once into an atlas, 4 walking frames per row.
// Our crowd walks away from the camera (back view); enemies face it.
const SPR = 3.2, CELL_W = 18, CELL_H = 25, FOOT = 22, DRAW_K = 1.35;
const atlas = document.createElement('canvas');
const spr = new Array(2 * NT).fill(null);

function drawChar(g, team, type, f) {
  const main = TCOL[team][type];
  const light = team ? C['theirs-light'] : C['ours-light'];
  const deep = team ? C['theirs-deep'] : C['ours-deep'];
  const front = team === 1;
  const sw = f === 1 ? 1 : f === 3 ? -1 : 0;
  const shape = (path, fill) => { g.beginPath(); path(); g.fillStyle = fill; g.fill(); g.stroke(); };
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.lineWidth = 1.1; g.strokeStyle = C.outline;
  g.fillStyle = C.shadow;
  g.beginPath(); g.ellipse(0, 0, 6, 2.2, 0, 0, TAU); g.fill();

  if (type === T.BOMBER) {
    shape(() => { g.rect(-3.2, -3.5 + sw, 2.2, 3.5 - sw); g.rect(1, -3.5 - sw, 2.2, 3.5 + sw); }, deep);
    shape(() => g.arc(0, -8.5, 5.6, 0, TAU), C.bomb);
    g.strokeStyle = main; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-5.2, -7.6); g.quadraticCurveTo(0, -4.8, 5.2, -7.6); g.stroke();
    g.strokeStyle = C.wood; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(1.5, -13.8); g.quadraticCurveTo(3, -16, 4.6, -16.4); g.stroke();
    g.fillStyle = C['ours-hot'];
    g.beginPath(); g.arc(4.8, -16.6, 1.3 + (f & 1) * 0.5, 0, TAU); g.fill();
    if (front) {
      g.fillStyle = C.paper;
      g.beginPath(); g.arc(-1.9, -9.6, 1.2, 0, TAU); g.arc(1.9, -9.6, 1.2, 0, TAU); g.fill();
    }
    g.globalAlpha = 0.3; g.fillStyle = C.paper;
    g.beginPath(); g.arc(-2.3, -11, 1.5, 0, TAU); g.fill(); g.globalAlpha = 1;
    return;
  }

  const wide = type === T.TANK ? 10 : type === T.RUNNER ? 6 : type >= T.HEAVY ? 9.5 : 7.5;
  const lx = wide * 0.24;
  if (type === T.TANK && !front) shape(() => rrectOn(g, -6.6, -12.6, 13.2, 9, 2), C.steel);
  shape(() => {
    g.rect(-lx - 1.1, -4.5 + sw * 1.2, 2.2, 4.5 - sw * 1.2);
    g.rect(lx - 1.1, -4.5 - sw * 1.2, 2.2, 4.5 + sw * 1.2);
  }, deep);
  shape(() => g.arc(-wide / 2 - 0.4, -8 - sw, 1.6, 0, TAU), light);
  shape(() => g.arc(wide / 2 + 0.4, -8 + sw, 1.6, 0, TAU), light);
  shape(() => rrectOn(g, -wide / 2, -12, wide, 8.2, 3), main);
  if (!front) shape(() => rrectOn(g, -2.4, -11.2, 4.8, 4.6, 1.2), deep);
  else { g.strokeStyle = deep; g.beginPath(); g.moveTo(-wide / 2 + 0.6, -6.2); g.lineTo(wide / 2 - 0.6, -6.2); g.stroke(); g.strokeStyle = C.outline; }

  const hr = type >= T.HEAVY ? 4.2 : 3.8;
  shape(() => g.arc(0, -15, hr, 0, TAU), light);
  if (front) {
    g.fillStyle = C.outline;
    g.beginPath(); g.arc(-1.4, -15.2, 0.7, 0, TAU); g.arc(1.4, -15.2, 0.7, 0, TAU); g.fill();
  }
  g.globalAlpha = 0.45; g.fillStyle = C.paper;
  g.beginPath(); g.arc(-1.3, -16.5, 1.1, 0, TAU); g.fill(); g.globalAlpha = 1;

  if (type === T.RUNNER) {
    g.strokeStyle = C.paper; g.lineWidth = 1.3;
    g.beginPath(); g.moveTo(-3.6, -16); g.lineTo(3.6, -16); g.moveTo(-3.4, -16); g.lineTo(-6.4, -14.8 + sw); g.stroke();
    g.strokeStyle = C.outline; g.lineWidth = 1.1;
  } else if (type === T.TANK) {
    shape(() => { g.arc(0, -15.4, 4.1, Math.PI, 0); g.closePath(); }, C.steel);
    if (front) {
      shape(() => rrectOn(g, -5.6, -11.6, 11.2, 8, 2), C.steel);
      shape(() => g.arc(0, -7.6, 1.3, 0, TAU), C.paper);
    }
  } else if (type === T.ARCHER) {
    shape(() => { g.moveTo(-4.2, -14.2); g.quadraticCurveTo(0, -22.5, 4.2, -14.2); g.quadraticCurveTo(0, -17.2, -4.2, -14.2); }, deep);
    g.strokeStyle = C.wood; g.lineWidth = 1.5;
    g.beginPath(); g.arc(front ? 3 : 3.6, front ? -8.5 : -11, 5.6, -1.25, 1.25); g.stroke();
    g.strokeStyle = C.outline; g.lineWidth = 1.1;
  } else if (type === T.HEAVY) {
    shape(() => { g.arc(0, -15.6, 4.4, Math.PI, 0); g.closePath(); }, C.steel);
    shape(() => { g.moveTo(-4.2, -16); g.lineTo(-6.6, -20.4); g.lineTo(-2.6, -18.6); g.closePath(); }, C.paper);
    shape(() => { g.moveTo(4.2, -16); g.lineTo(6.6, -20.4); g.lineTo(2.6, -18.6); g.closePath(); }, C.paper);
  } else if (type === T.GIANT) {
    shape(() => {
      g.moveTo(-4, -17.6); g.lineTo(-4.4, -21.4); g.lineTo(-2, -19.4); g.lineTo(0, -22.2);
      g.lineTo(2, -19.4); g.lineTo(4.4, -21.4); g.lineTo(4, -17.6); g.closePath();
    }, C.ours);
  }
}

function buildSprites() {
  let y = 0, wmax = 0;
  for (let team = 0; team < 2; team++) {
    for (let type = 0; type < NT; type++) {
      if (team === 0 && type === T.GIANT) continue;
      const k = UNIT[type].s * DRAW_K * SPR, cw = Math.ceil(CELL_W * k), ch = Math.ceil(CELL_H * k);
      spr[team * NT + type] = { sy: y, cw, ch, k };
      y += ch; wmax = Math.max(wmax, cw * 4);
    }
  }
  atlas.width = wmax; atlas.height = y;
  const g = atlas.getContext('2d');
  for (let b = 0; b < 2 * NT; b++) {
    const sp = spr[b];
    if (!sp) continue;
    for (let f = 0; f < 4; f++) {
      g.setTransform(sp.k, 0, 0, sp.k, f * sp.cw + sp.cw / 2, sp.sy + FOOT * sp.k);
      drawChar(g, (b / NT) | 0, b % NT, f);
    }
  }
}

function drawUnit(i) {
  const type = utype[i], sp = spr[uteam[i] * NT + type];
  const z = uair[i] > 0 ? Math.sin((1 - uair[i] / 0.9) * Math.PI) * 60 : 0;
  proj(ux[i], uy[i], z);
  const u = UNIT[type].s * DRAW_K * PS, f = ((uph[i] * 0.6) | 0) & 3;
  ctx.drawImage(atlas, f * sp.cw, sp.sy, sp.cw, sp.ch, PX - CELL_W / 2 * u, PY - FOOT * u, CELL_W * u, CELL_H * u);
}

// ---- Depth ordering ----
// Units are counting-sorted into depth bins; the few props (towers, obstacles, gates)
// are kept sorted and drawn as the sweep passes them, far to near.
const NB = 128, BY0 = -40, BY1 = H + 40, BIN = (BY1 - BY0) / NB;
const binStart = new Int32Array(NB + 1), binCur = new Int32Array(NB), binIdx = new Int32Array(MAX);
function binOf(y) { const b = ((y - BY0) / BIN) | 0; return b < 0 ? 0 : b >= NB ? NB - 1 : b; }
function binUnits() {
  binStart.fill(0);
  for (let k = 0; k < nAct; k++) binStart[binOf(uy[act[k]]) + 1]++;
  for (let b = 0; b < NB; b++) { binStart[b + 1] += binStart[b]; binCur[b] = binStart[b]; }
  for (let k = 0; k < nAct; k++) { const i = act[k]; binIdx[binCur[binOf(uy[i])]++] = i; }
}

let props = [];
function buildProps() {
  props = [];
  for (const tw of towers) props.push({ k: 0, ref: tw, d: 0 });
  for (const o of obstacles) props.push({ k: 1, ref: o, d: 0 });
  for (const g of gates) props.push({ k: 2, ref: g, d: 0 });
}
function sortProps() {
  for (let n = 0; n < props.length; n++) {
    const p = props[n], r = p.ref;
    p.d = p.k === 0 ? r.y + r.h / 2 : p.k === 2 ? r.y : r.k === 0 ? r.y + r.h : r.y;
  }
  for (let n = 1; n < props.length; n++) {
    const p = props[n];
    let m = n - 1;
    while (m >= 0 && props[m].d > p.d) { props[m + 1] = props[m]; m--; }
    props[m + 1] = p;
  }
}

function drawProp(p) {
  if (p.k === 0) drawTower(p.ref);
  else if (p.k === 2) drawGate(p.ref);
  else drawObstacle(p.ref);
}

function drawTower(tw) {
  const hitOff = tw.hit > 0 && !reduceMotion ? (Math.random() - 0.5) * 3 : 0;
  const x = tw.x + hitOff, x0 = x - tw.w / 2, x1 = x + tw.w / 2, yf = tw.y - tw.h / 2, yn = tw.y + tw.h / 2;
  const Z = tw.h * 1.15;
  const front = tw.boss ? C['theirs-deep'] : C.theirs;
  if (tw.hp <= 0) {
    // Sink into the ground, then leave rubble.
    if (tw.fall > 0) box(x0, yf, x1, yn, Z * tw.fall / 0.6, C['theirs-light'], front, C['theirs-deep']);
    box(x0 + 10, yn - 24, x1 - 10, yn, 10, C['rock-edge'], C.rock, C['lane-line']);
    return;
  }
  box(x0, yf, x1, yn, Z, C['theirs-light'], front, C['theirs-deep']);
  if (tw.flash > 0) {
    ctx.globalAlpha = tw.flash / 0.09 * 0.55;
    ctx.fillStyle = C.paper;
    ctx.beginPath(); moveTo3(x0, yn, 0); lineTo3(x1, yn, 0); lineTo3(x1, yn, Z); lineTo3(x0, yn, Z); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // Battlements along the front edge.
  proj(x0, yn, Z);
  const fx = PX, fy = PY, s = PS, fw = tw.w * s;
  const n = Math.max(3, Math.round(tw.w / 32)), step = fw / n;
  ctx.fillStyle = front;
  ctx.beginPath();
  for (let c = 0; c < n; c++) ctx.rect(fx + c * step + step * 0.18, fy - 12 * s, step * 0.64, 12.5 * s);
  ctx.fill();
  if (tw.boss) {
    ctx.fillStyle = C.ours;
    ctx.beginPath();
    for (let c = -1; c <= 1; c++) {
      const cx = fx + fw / 2 + c * 26 * s;
      ctx.moveTo(cx - 9 * s, fy - 12 * s); ctx.lineTo(cx, fy - (28 + (c === 0 ? 8 : 0)) * s); ctx.lineTo(cx + 9 * s, fy - 12 * s);
    }
    ctx.fill();
  }
  proj(x, yn, 0);
  ctx.fillStyle = C.ink;
  ctx.beginPath(); rrect(PX - 15 * PS, PY - 32 * PS, 30 * PS, 32 * PS, 13 * PS); ctx.fill();
  proj(x, yn, Z * 0.62);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.paper;
  ctx.font = Math.round((tw.w < 110 ? 26 : 32) * PS * (1 + Math.max(0, tw.flash) * 3)) + 'px ' + FONT;
  ctx.fillText(String(Math.ceil(tw.hp)), PX, PY);
  proj(x, yf, Z);
  const by = PY - (tw.boss ? 40 : 24) * PS, bw = tw.w * PS * 0.9;
  ctx.fillStyle = C.ink; ctx.fillRect(PX - bw / 2, by, bw, 6);
  ctx.fillStyle = C.theirs; ctx.fillRect(PX - bw / 2, by, bw * tw.hp / tw.max, 6);
  if (tw.shield > 0) {
    proj(x, tw.y, Z * 0.5);
    ctx.globalAlpha = 0.5 + Math.sin(t * 12) * 0.2;
    ctx.strokeStyle = C.paper; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(PX, PY, tw.w * 0.7 * PS, (Z * 0.5 + 34) * PS, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawObstacle(o) {
  if (o.k === 0) {
    box(o.x, o.y, o.x + o.w, o.y + o.h, 16, C['rock-edge'], C.rock, C['lane-line']);
  } else if (o.k === 1) {
    const hx = Math.cos(o.a) * o.len / 2, hy = Math.sin(o.a) * o.len / 2;
    proj(o.x, o.y, 0);
    const bx = PX, by = PY, bs = PS;
    ctx.fillStyle = C.shadow;
    ctx.beginPath(); ctx.ellipse(bx, by, 9 * bs, 4 * bs, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = C['lane-line'];
    ctx.fillRect(bx - 4 * bs, by - 10 * bs, 8 * bs, 10 * bs);
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.outline; ctx.lineWidth = 11 * bs;
    ctx.beginPath(); moveTo3(o.x - hx, o.y - hy, 10); lineTo3(o.x + hx, o.y + hy, 10); ctx.stroke();
    ctx.strokeStyle = C['rock-edge']; ctx.lineWidth = 7 * bs;
    ctx.beginPath(); moveTo3(o.x - hx, o.y - hy, 10); lineTo3(o.x + hx, o.y + hy, 10); ctx.stroke();
    proj(o.x, o.y, 10);
    ctx.fillStyle = C.paper;
    ctx.beginPath(); ctx.arc(PX, PY, 3.5 * PS, 0, TAU); ctx.fill();
  } else {
    const ry0 = Y0 + GY * sAt(o.y - o.r), ry1 = Y0 + GY * sAt(o.y + o.r);
    proj(o.x, o.y, 0);
    const cx = PX, cy = PY, rx = o.r * PS, ry = (ry1 - ry0) / 2, zt = 14 * PS;
    ctx.fillStyle = C.shadow;
    ctx.beginPath(); ctx.ellipse(cx, cy + 2, rx + 3, ry + 2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = C.rock;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI); ctx.rect(cx - rx, cy - zt, rx * 2, zt); ctx.fill();
    ctx.fillStyle = o.flash > 0 ? C.paper : C['rock-edge'];
    ctx.beginPath(); ctx.ellipse(cx, cy - zt, rx, ry, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.rock; ctx.lineWidth = 2.5 * PS;
    ctx.beginPath(); ctx.ellipse(cx, cy - zt, rx * 0.6, ry * 0.6, 0, 0, TAU); ctx.stroke();
  }
}

// Gates are archways: a glowing floor strip, two posts and a banner with the label.
function drawGate(g) {
  const col = g.op !== '-' ? C.good : C.bad;
  const broken = g.broken > 0;
  ctx.globalAlpha = broken ? 0.1 : g.flash > 0 ? 0.5 : 0.24;
  ctx.fillStyle = col;
  ctx.beginPath(); groundQuad(g.x, g.y - 9, g.x + g.w, g.y + 9, 0); ctx.fill();
  ctx.globalAlpha = broken ? 0.35 : 1;
  proj(g.x, g.y, 0);
  const lx = PX, ly = PY, s = PS;
  proj(g.x + g.w, g.y, 0);
  const rxp = PX;
  const top = ly - (48 + (g.flash > 0 ? 4 : 0)) * s, bot = ly - 26 * s;
  ctx.strokeStyle = C.outline; ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, top); ctx.moveTo(rxp, ly); ctx.lineTo(rxp, top); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 3.5 * s;
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, top); ctx.moveTo(rxp, ly); ctx.lineTo(rxp, top); ctx.stroke();
  ctx.fillStyle = g.flash > 0 ? C.paper : col;
  ctx.beginPath(); rrect(lx - 2 * s, top - 2 * s, rxp - lx + 4 * s, bot - top + 4 * s, 4 * s); ctx.fill();
  ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5;
  ctx.beginPath(); rrect(lx - 2 * s, top - 2 * s, rxp - lx + 4 * s, bot - top + 4 * s, 4 * s); ctx.stroke();
  ctx.fillStyle = C.ink;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.round(21 * s) + 'px ' + FONT;
  ctx.fillText(g.op === '-' ? (broken ? 'broken' : '−' + g.left) : g.label, (lx + rxp) / 2, (top + bot) / 2 + 1);
  ctx.globalAlpha = 1;
}

function drawCannon() {
  const p = CN.pattern;
  proj(cannonX, CANNON_Y, 0);
  ctx.save();
  ctx.translate(PX, PY); ctx.scale(PS, PS);
  ctx.fillStyle = C.shadow;
  ctx.beginPath(); ctx.ellipse(0, 10, 30, 11, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = C['ours-deep'];
  ctx.beginPath(); ctx.ellipse(0, 6, 24, 10, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = C['lane-line']; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, -4, 24, 0, TAU); ctx.stroke();
  ctx.strokeStyle = charge >= CN.charge - 1 ? C.paper : C.ours;
  ctx.beginPath(); ctx.arc(0, -4, 24, -Math.PI / 2, -Math.PI / 2 + TAU * charge / CN.charge); ctx.stroke();
  ctx.save();
  ctx.translate(0, recoil * 7);
  if (recoil > 0.55) {
    ctx.globalAlpha = recoil; ctx.fillStyle = C['ours-light'];
    ctx.beginPath(); ctx.arc(0, p === 'lob' ? -36 : -42, 9 * recoil, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = C['ours-deep'];
  ctx.beginPath();
  if (p === 'spread') {
    for (let d = -1; d <= 1; d++) {
      ctx.save(); ctx.translate(0, -4); ctx.rotate(d * 0.45);
      rrect(-5, -32, 10, 22, 4);
      ctx.restore();
    }
  } else if (p === 'lob') rrect(-11, -32, 22, 18, 6);
  else if (CN.type === T.RUNNER) { rrect(-10, -38, 7, 26, 3); rrect(3, -38, 7, 26, 3); }
  else if (CN.type === T.TANK) rrect(-10, -38, 20, 26, 5);
  else rrect(-7, -38, 14, 26, 5);
  ctx.fill();
  if (CN.type === T.ARCHER) {
    ctx.strokeStyle = C.wood; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -18, 20, -Math.PI + 0.5, -0.5); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = C.ours;
  ctx.beginPath(); ctx.arc(0, -4, 17, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.4; ctx.fillStyle = C.paper;
  ctx.beginPath(); ctx.arc(-6, -10, 5, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = C.ink;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '13px ' + FONT;
  ctx.fillText(String(CN.charge - charge), 0, -3);
  ctx.restore();
}

// Floating counters: running gate totals and tower damage, drawn above everything.
function popText(text, x, y, z, fill, size, alpha) {
  proj(x, y, z);
  ctx.globalAlpha = alpha;
  ctx.font = Math.round(size * PS) + 'px ' + FONT;
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = C.outline;
  ctx.strokeText(text, PX, PY);
  ctx.fillStyle = fill;
  ctx.fillText(text, PX, PY);
  ctx.globalAlpha = 1;
}

function drawPops() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let k = 0; k < gates.length; k++) {
    const g = gates[k];
    if (g.popT <= 0 || g.pop === 0) continue;
    const pulse = g.popT > 0.78 ? (g.popT - 0.78) * 3 : 0;
    popText((g.pop > 0 ? '+' : '−') + Math.abs(g.pop), g.x + g.w / 2, g.y, 62 + (0.9 - g.popT) * 26,
      g.pop > 0 ? C.ours : C.bad, 24 * (1 + pulse), Math.min(1, g.popT * 4));
  }
  for (let k = 0; k < towers.length; k++) {
    const tw = towers[k];
    if (tw.dmgT <= 0 || tw.dmg <= 0) continue;
    popText('−' + Math.ceil(tw.dmg), tw.x + tw.w * 0.3, tw.y - tw.h / 2, tw.h * 1.15 + 52 + (0.8 - tw.dmgT) * 30,
      C.paper, 28, Math.min(1, tw.dmgT * 4));
  }
}

let skyGrad = null;
const FIELDS = [C['field-1'], C['field-2'], C['field-3'], C['field-4']];

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.ink;
  ctx.fillRect(0, 0, cv.width, cv.height);
  let sx = 0, sy = 0;
  if (shake > 0 && !reduceMotion) { sx = (Math.random() - 0.5) * 6; sy = (Math.random() - 0.5) * 6; }
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * (offY + sy * scale));

  // Sky, field and the tilted track.
  if (!skyGrad) {
    skyGrad = ctx.createLinearGradient(0, -200, 0, HORIZON_Y);
    skyGrad.addColorStop(0, C['sky-top']); skyGrad.addColorStop(1, C['sky-low']);
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-W, -400, W * 3, HORIZON_Y + 400);
  const field = FIELDS[Math.min(3, (levelIdx / 5) | 0)];
  ctx.fillStyle = field;
  // Distant hills on the horizon.
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.moveTo(-W, HORIZON_Y);
  for (let x = -W; x <= W * 2; x += 12) ctx.lineTo(x, HORIZON_Y - 14 - Math.sin(x * 0.019) * 9 - Math.sin(x * 0.047 + 1) * 5);
  ctx.lineTo(W * 2, HORIZON_Y); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillRect(-W, HORIZON_Y, W * 3, H + 400);
  ctx.fillStyle = C.lane;
  ctx.beginPath(); groundQuad(TL, 0, TR, H + 60, 0); ctx.fill();
  ctx.fillStyle = C['lane-line'];
  ctx.beginPath();
  const off = (t * 40) % 80;
  for (let y = H + 60 - off; y > -40; y -= 80) groundQuad(TL, Math.max(0, y - 40), TR, Math.max(0, y), 0);
  ctx.fill();
  ctx.fillStyle = C.rail;
  ctx.beginPath(); groundQuad(TL - 8, 0, TL, H + 60, 0); groundQuad(TR, 0, TR + 8, H + 60, 0); ctx.fill();
  ctx.fillStyle = base.hp / base.max < 0.35 ? C.bad : C.rail;
  ctx.beginPath(); groundQuad(TL, BASE_Y + 4, TR, BASE_Y + 9, 0); ctx.fill();

  // Explosion rings on the ground.
  ctx.strokeStyle = C['ours-hot']; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let j = 0; j < MAXR; j++) {
    if (rlife[j] <= 0) continue;
    const rad = BOMB_RADIUS * rsz[j] * (1.15 - rlife[j] / 0.3 * 0.6);
    proj(rx[j], ry[j], 0);
    ctx.moveTo(PX + rad * PS, PY); ctx.ellipse(PX, PY, rad * PS, rad * PS * 0.5, 0, 0, TAU);
  }
  ctx.stroke();

  // Everything that stands up, far to near.
  sortProps();
  binUnits();
  let pi = 0;
  for (let b = 0; b < NB; b++) {
    const limit = BY0 + (b + 1) * BIN;
    while (pi < props.length && props[pi].d < limit) drawProp(props[pi++]);
    for (let k = binStart[b]; k < binStart[b + 1]; k++) drawUnit(binIdx[k]);
  }
  while (pi < props.length) drawProp(props[pi++]);
  drawPops();

  // Arrows.
  ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (let team = 0; team < 2; team++) {
    ctx.strokeStyle = team ? C['theirs-light'] : C['ours-light'];
    ctx.beginPath();
    for (let q = 0; q < MAXQ; q++) {
      if (qlife[q] <= 0 || qteam[q] !== team) continue;
      moveTo3(qx[q], qy[q], 10); lineTo3(qx[q] - qvx[q] * 0.025, qy[q] - qvy[q] * 0.025, 10);
    }
    ctx.stroke();
  }

  // Particles.
  for (let team = 0; team < 2; team++) {
    ctx.fillStyle = team ? C.theirs : C.ours;
    ctx.beginPath();
    for (let j = 0; j < MAXP; j++) {
      if (plife[j] <= 0 || pteam[j] !== team) continue;
      proj(px[j], py[j], pz[j]);
      const s = (1 + plife[j] * 5) * PS;
      ctx.rect(PX - s / 2, PY - s / 2, s, s);
    }
    ctx.fill();
  }

  drawCannon();

  // HUD.
  const by = H - 34;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.muted; ctx.font = '13px ' + FONT;
  ctx.fillText('BASE', TL + 4, by - 6);
  ctx.textAlign = 'right';
  ctx.fillText('CROWD ' + count[0], TR - 4, by - 6);
  ctx.fillStyle = C.ink; ctx.fillRect(TL + 4, by, TR - TL - 8, 8);
  ctx.fillStyle = base.hp / base.max < 0.35 ? C.bad : C.good;
  ctx.fillRect(TL + 4, by, (TR - TL - 8) * base.hp / base.max, 8);
  ctx.textAlign = 'center';
  ctx.fillStyle = C.paper; ctx.font = '14px ' + FONT;
  ctx.fillText((levelIdx + 1) + ' · ' + L.name.toUpperCase() + '   ' + CN.name.toUpperCase(), W / 2, H - 10);

  if (state === 'play' && shots === 0) {
    ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.3;
    ctx.fillStyle = C.paper; ctx.font = '22px ' + FONT;
    ctx.fillText('Drag to aim · hold to fire', W / 2, CANNON_Y - 110);
    ctx.globalAlpha = 1;
  }

  // Red edge flash when the base is hit.
  if (hurt > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = Math.min(0.55, hurt * 1.4);
    ctx.strokeStyle = C.bad; ctx.lineWidth = 26 * dpr;
    ctx.strokeRect(0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
  }
}

// ---- Loop ----
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 1 / 30) dt = 1 / 30;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---- Input ----
function worldX(clientX) {
  const r = cv.getBoundingClientRect();
  // Convert from the tilted view back to track coordinates at the cannon's depth.
  return CX + ((clientX - r.left - offX) / scale - CX) / S_CANNON;
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  firing = true; targetX = worldX(e.clientX);
  e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (firing && state === 'play') targetX = worldX(e.clientX); });
const stop = () => { firing = false; };
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft') keyL = true;
  else if (e.code === 'ArrowRight') keyR = true;
  else if (e.code === 'Space' && state === 'play') { keySpace = true; e.preventDefault(); }
  else if (e.code === 'Escape' && state === 'play') pause();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft') keyL = false;
  else if (e.code === 'ArrowRight') keyR = false;
  else if (e.code === 'Space') { keySpace = false; firing = false; }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pause(); });

// ---- Menus ----
const overlay = document.getElementById('overlay');
const panels = ['menu', 'pick', 'result', 'paused'].map(id => document.getElementById(id));
const [menuEl, pickEl, resultEl, pausedEl] = panels;
const pauseBtn = document.getElementById('pauseBtn');
const levelsEl = document.getElementById('levels');
const cannonsEl = document.getElementById('cannons');
let pickLevel = 0;

function showPanel(el) {
  overlay.hidden = !el;
  for (const p of panels) p.hidden = p !== el;
  pauseBtn.hidden = !!el;
}

function renderLevels() {
  levelsEl.textContent = '';
  LEVELS.forEach((lv, i) => {
    if (i % 5 === 0) {
      const h = document.createElement('div');
      h.className = 'world';
      h.textContent = WORLDS[i / 5];
      levelsEl.appendChild(h);
    }
    const isBoss = lv.towers.some(d => d.boss);
    const b = document.createElement('button');
    b.className = 'lvl' + (i < unlocked ? ' done' : '') + (isBoss ? ' boss' : '');
    b.disabled = i > unlocked;
    b.setAttribute('aria-label', 'Level ' + (i + 1) + ', ' + lv.name);
    b.innerHTML = '<b>' + (i + 1) + '</b><span></span>';
    b.querySelector('span').textContent = isBoss ? 'Boss' : lv.towers.length > 1 ? lv.towers.length + ' towers' : ' ';
    b.addEventListener('click', () => showPick(i));
    levelsEl.appendChild(b);
  });
}

function renderCannons() {
  cannonsEl.textContent = '';
  CANNONS.forEach((c, i) => {
    const b = document.createElement('button');
    const locked = c.unlock > unlocked;
    b.className = 'cannon' + (i === cannonIdx ? ' on' : '');
    b.disabled = locked;
    b.setAttribute('aria-pressed', String(i === cannonIdx));
    b.innerHTML = '<b></b><span></span><i></i>';
    b.querySelector('b').textContent = c.name;
    b.querySelector('span').textContent = locked ? 'Beat level ' + c.unlock + ' to unlock' : c.desc;
    b.querySelector('i').textContent = locked ? '' : (c.pattern === 'spread' ? c.rate + ' volleys/s' : c.rate + ' shots/s');
    b.addEventListener('click', () => { cannonIdx = i; save(); renderCannons(); });
    cannonsEl.appendChild(b);
  });
}

function showMenu() {
  renderLevels();
  loadLevel(unlocked, true, 0);
  state = 'menu';
  showPanel(menuEl);
}

function showPick(i) {
  pickLevel = i;
  document.getElementById('pickEyebrow').textContent = 'Level ' + (i + 1) + ' · ' + LEVELS[i].name;
  renderCannons();
  showPanel(pickEl);
}

function startLevel(i, c) {
  if (c !== undefined) cannonIdx = c;
  loadLevel(i, false, cannonIdx);
  state = 'play';
  showPanel(null);
}

function pause() { if (state !== 'play') return; state = 'paused'; firing = false; showPanel(pausedEl); }

function showResult() {
  const won = state === 'won';
  const lastLevel = levelIdx === LEVELS.length - 1;
  document.getElementById('resEyebrow').textContent = 'Level ' + (levelIdx + 1) + ' · ' + L.name;
  document.getElementById('resTitle').textContent = won
    ? (lastLevel ? 'Every tower is down' : towers.length > 1 ? 'Towers down' : 'Tower down')
    : 'Base overrun';
  let text = won
    ? shots + ' shots fired, base at ' + base.hp + ' of ' + base.max + '.'
    : 'Towers still had ' + towers.reduce((s, tw) => s + Math.ceil(tw.hp), 0) + ' HP left.';
  if (won && newCannon >= 0) text += ' New cannon unlocked: ' + CANNONS[newCannon].name + '.';
  document.getElementById('resText').textContent = text;
  const primary = document.getElementById('resPrimary');
  primary.textContent = won ? (lastLevel ? 'Play again' : 'Next level') : 'Retry';
  const nextIdx = won ? (lastLevel ? 0 : levelIdx + 1) : levelIdx;
  primary.onclick = () => startLevel(nextIdx);
  document.getElementById('resCannon').onclick = () => showPick(nextIdx);
  showPanel(resultEl);
  primary.focus({ preventScroll: true });
}

pauseBtn.addEventListener('click', pause);
document.getElementById('pickStart').addEventListener('click', () => startLevel(pickLevel));
document.getElementById('pickBack').addEventListener('click', showMenu);
document.getElementById('resMenu').addEventListener('click', showMenu);
document.getElementById('pResume').addEventListener('click', () => { state = 'play'; showPanel(null); });
document.getElementById('pRestart').addEventListener('click', () => startLevel(levelIdx));
document.getElementById('pMenu').addEventListener('click', showMenu);

// Offline support when served as a standalone site (not inside an embed or a file:// page).
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}

// Debug hook for testing.
window.__stickstorm = {
  get state() { return state; }, get crowd() { return count[0]; }, get enemies() { return count[1]; },
  get tower() { return towers.reduce((s, tw) => s + tw.hp, 0); }, get base() { return base.hp; },
  startLevel, LEVELS, CANNONS, draw,
  step(n, aimX) { for (let k = 0; k < n; k++) { if (aimX !== undefined) targetX = aimX(t); if (state === 'play') firing = true; update(1 / 60); } },
};

buildSprites();
resize();
showMenu();
requestAnimationFrame(loop);
})();
</script>
